# Publishes @johngaynor/entourage to npm when a GitHub release is published.
# Signs in to npm by trusted publishing (https://docs.npmjs.com/trusted-publishers),
# so there is no token. On npmjs.com the package's trusted publisher must name
# this repo and this file (publish.yml). It needs npm 11.5.1 or later, which
# Node 24 ships.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job prove to npm which repo and workflow it is
    steps:
      - uses: actions/checkout@v7
      # setup-node stays on v6. From v7 it no longer sets a placeholder
      # NODE_AUTH_TOKEN, which changes how npm signs in, and this job can only
      # be tested by publishing a real release.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm test
      - run: npm publish --access public
