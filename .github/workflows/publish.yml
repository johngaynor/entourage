# Publishes @johngaynor/entourage to npm. There are two ways in:
#   - A GitHub release is published: the stable version goes out under npm's
#     `latest` tag, which is what `entourage update` installs.
#   - A push lands on main: a merge build goes out under the `next` tag, as
#     X.Y.(Z+1)-next.N. No machine installs it unless asked.
# Signs in to npm by trusted publishing (https://docs.npmjs.com/trusted-publishers),
# so there is no token. On npmjs.com the package's trusted publisher must name
# this repo and this file (publish.yml), which is why both ways in are in one
# file. It needs npm 11.5.1 or later, which Node 24 ships.
name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches: [main]

# One run at a time for each way in. `queue: max` keeps every waiting run (up
# to 100) instead of dropping all but the newest, so each push gets a build of
# its own and no release is lost. GitHub does not promise the order waiting
# runs start in, which is one reason a merge build is checked against `next`
# before it is published (next-moves-forward.sh).
concurrency:
  group: publish-${{ github.event_name }}
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job prove to npm which repo and workflow it is
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a merge build's number counts commits since the release tag
      # setup-node stays on v6. From v7 it no longer sets a placeholder
      # NODE_AUTH_TOKEN, which changes how npm signs in, and this job can only
      # be tested by publishing for real.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          case $version in
            *-*) echo "$version is not a stable version; a release publishes to latest" >&2; exit 1 ;;
          esac
      - run: npm test

      - name: Publish the release
        if: github.event_name == 'release'
        run: npm publish --access public

      - name: Number the merge build
        if: github.event_name == 'push'
        run: |
          version=$(.github/scripts/merge-build-version.sh)
          npm version "$version" --no-git-tag-version
      - name: Publish the merge build
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          case $version in
            *-next.*) ;;
            *) echo "Refusing to publish $version as a merge build" >&2; exit 1 ;;
          esac
          .github/scripts/next-moves-forward.sh
          npm publish --access public --tag next
